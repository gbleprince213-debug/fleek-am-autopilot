# Runs the tests and the daily job on every push and each weekday morning.
#
# Optional: also publish the dashboard to GitHub Pages (needs a public repo,
# or a paid plan for a private one):
#   1. Settings -> Pages -> Source: "GitHub Actions"
#   2. Settings -> Secrets and variables -> Actions -> Variables ->
#      New repository variable PUBLISH_DASHBOARD = true
# Without that variable the publish steps are skipped, so the run stays green.
name: daily-run

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 6 * * 1-5"   # weekdays before the AM's day starts (UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-run
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: "Daily job (demo data: first book, then the new batch, then the same batch again)"
        run: make demo
      - name: Build site
        if: vars.PUBLISH_DASHBOARD == 'true'
        run: |
          mkdir -p site
          cp out/dashboard.html site/index.html
          cp out/run_summary.md out/queue_today.csv out/review_queue.csv site/
      - uses: actions/upload-pages-artifact@v3
        if: vars.PUBLISH_DASHBOARD == 'true'
        with:
          path: site

  deploy:
    needs: run
    if: vars.PUBLISH_DASHBOARD == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
